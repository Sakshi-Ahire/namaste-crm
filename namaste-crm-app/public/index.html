<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5f">
<title>Namaste Mobile CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar + tab strip; dashboard = KPI strip, then team table + source mix; leads = filter bar + card list; lead detail = right-side sheet (bottom sheet on phones) */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#eaeeec; --line:#d9e0dd; --ink:#132522; --muted:#5b6d69;
  --accent:#0d6b5f; --accent-ink:#ffffff; --accent-soft:#dcefeb; --marigold:#d98c0b; --marigold-soft:#fbefd6;
  --good:#1d7a3e; --good-soft:#ddf1e3; --warn:#a76300; --warn-soft:#fbecd2; --bad:#b4342a; --bad-soft:#f8e0dd;
  --c-new:#2563a8; --c-new-bg:#e1ecf8; --c-con:#4b5d6b; --c-con-bg:#e6ebee; --c-int:#0d6b5f; --c-int-bg:#dcefeb;
  --c-price:#6b46a8; --c-price-bg:#ece5f7; --c-neg:#a76300; --c-neg-bg:#fbecd2; --c-book:#3346a8; --c-book-bg:#e3e7f8;
  --c-sold:#1d7a3e; --c-sold-bg:#ddf1e3; --c-lost:#b4342a; --c-lost-bg:#f8e0dd; --c-nr:#6f6a62; --c-nr-bg:#ecebe8;
  --shadow:0 10px 30px rgba(19,37,34,.14);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#16211f; --sunk:#1d2a28; --line:#2a3a37; --ink:#e4ecea; --muted:#93a6a2;
  --accent:#3fb7a5; --accent-ink:#06201c; --accent-soft:#173a35; --marigold:#f0b443; --marigold-soft:#3a2d12;
  --good:#5cc483; --good-soft:#173322; --warn:#f0b443; --warn-soft:#3a2d12; --bad:#f07a6f; --bad-soft:#3b1d1a;
  --c-new:#7fb2ec; --c-new-bg:#1a2b40; --c-con:#a9b8c3; --c-con-bg:#243039; --c-int:#5fcab9; --c-int-bg:#173a35;
  --c-price:#b99cf0; --c-price-bg:#2c2340; --c-neg:#f0b443; --c-neg-bg:#3a2d12; --c-book:#9aa8f2; --c-book-bg:#232a4a;
  --c-sold:#5cc483; --c-sold-bg:#173322; --c-lost:#f07a6f; --c-lost-bg:#3b1d1a; --c-nr:#b5ada2; --c-nr-bg:#2c2a27;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#16211f; --sunk:#1d2a28; --line:#2a3a37; --ink:#e4ecea; --muted:#93a6a2;
  --accent:#3fb7a5; --accent-ink:#06201c; --accent-soft:#173a35; --marigold:#f0b443; --marigold-soft:#3a2d12;
  --good:#5cc483; --good-soft:#173322; --warn:#f0b443; --warn-soft:#3a2d12; --bad:#f07a6f; --bad-soft:#3b1d1a;
  --c-new:#7fb2ec; --c-new-bg:#1a2b40; --c-con:#a9b8c3; --c-con-bg:#243039; --c-int:#5fcab9; --c-int-bg:#173a35;
  --c-price:#b99cf0; --c-price-bg:#2c2340; --c-neg:#f0b443; --c-neg-bg:#3a2d12; --c-book:#9aa8f2; --c-book-bg:#232a4a;
  --c-sold:#5cc483; --c-sold-bg:#173322; --c-lost:#f07a6f; --c-lost-bg:#3b1d1a; --c-nr:#b5ada2; --c-nr-bg:#2c2a27;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:9px;background:var(--marigold);display:grid;place-items:center;color:#1b1300;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand h1{font-family:var(--f-display);font-size:19px;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:180px}
.tabs{display:flex;gap:2px;width:100%;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:12px}

main{max-width:1180px;margin:0 auto;padding-block:18px 80px;padding-inline:16px}
.banner{padding:10px 14px;border-radius:10px;background:var(--marigold-soft);color:var(--ink);font-size:14px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0}

/* dashboard */
.dash-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.dash-head h2{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.015em}
.dash-head .date{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--bad);background:var(--bad-soft)}
.kpi.alert .val{color:var(--bad)}
.kpi.warn .val{color:var(--warn)}
.kpi.good .val{color:var(--good)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h3{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.zero{color:var(--muted)}
.hot{color:var(--bad);font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.bar-track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:5px}
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.month{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.month div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.month b{display:block;font-family:var(--f-display);font-size:22px}
.month span{font-size:12px;color:var(--muted)}

/* leads */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:170px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.lead{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.lead:hover{border-color:var(--muted)}
.lead.overdue{border-left-color:var(--bad)}
.lead.due{border-left-color:var(--marigold)}
.lead .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .ph{font-size:13px;color:var(--muted)}
.lead .md{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .meta{font-size:13px;color:var(--muted)}
.lead .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.fu{font-size:12px;font-weight:600}
.fu.over{color:var(--bad)} .fu.today{color:var(--warn)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.42);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--f-display);font-size:21px;margin:0;line-height:1.2;overflow-wrap:anywhere}
.sheet-head .x{margin-left:auto;border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.sheet-body{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px;flex:1}
.sheet-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);width:100%}
.field textarea{min-height:64px;resize:vertical}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;font-size:14px}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contact .phone{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;user-select:all}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;overflow-wrap:anywhere}
.section-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.stage-row{display:flex;flex-wrap:wrap;gap:6px}
.stage-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.stage-btn[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{font-size:14px;border-left:2px solid var(--line);padding-left:10px}
.log time{display:block;font-size:12px;color:var(--muted)}
.note-row{display:flex;gap:8px}
.note-row input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:var(--shadow);padding:13px 18px;border-radius:14px;font-size:15px}

/* team */
.team-list{display:flex;flex-direction:column;gap:8px;max-width:720px}
.member{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex-wrap:wrap}
.member .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.member .info{flex:1;min-width:140px}
.member .info b{display:block}
.member .info span{font-size:13px;color:var(--muted)}
.member.off{opacity:.6}
.add-member{display:flex;gap:8px;flex-wrap:wrap;max-width:720px;margin-bottom:14px}
.add-member input{flex:1 1 180px;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.help{color:var(--muted);font-size:14px;max-width:720px}

@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:28px}
  .lead{grid-template-columns:minmax(0,1fr) auto}
  .lead .c2,.lead .c3{grid-column:1/2}
  .lead .right{grid-row:1/4;grid-column:2}
  .form{grid-template-columns:1fr}
  .sheet{top:auto;height:92%;width:100%;border-radius:16px 16px 0 0}
  .who span{display:none}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px)}}}
</style>
</head>
<body>
<style>
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.auth-card h2{font-family:var(--f-display);margin:0;font-size:24px}
.auth-card p{margin:0;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:1em}
.chat{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;background:var(--sunk);border-radius:10px;padding:10px}
.bubble{max-width:85%;padding:7px 10px;border-radius:10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bubble.out{align-self:flex-end;background:#d9fdd3;color:#111b21}
:root[data-theme="dark"] .bubble.out{background:#144d37;color:#e9edef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bubble.out{background:#144d37;color:#e9edef}}
.bubble small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.bubble.failed{outline:1px solid var(--bad)}
.unread{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:#1f9d55;color:#fff;font-size:12px;font-weight:700;text-align:center}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.auto-list{display:flex;flex-direction:column;gap:10px;max-width:720px}
.auto-item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.auto-item div{flex:1;min-width:200px}
.auto-item b{display:block}
.auto-item span{font-size:13px;color:var(--muted)}
h2.sec{font-family:var(--f-display);font-size:20px;margin:24px 0 10px}
</style>

<div id="authRoot"></div>
<div id="appRoot" hidden>
<header class="top">
  <div class="top-in">
    <div class="brand"><div class="mark" aria-hidden="true">न</div><div><h1 id="storeName">Namaste Mobile</h1><small id="whoLine">Enquiry &amp; follow-up tracker</small></div></div>
    <div class="who"><span id="waState"></span><button class="btn small" id="logoutBtn" type="button">Log out</button></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="dash" aria-selected="true">Dashboard</button>
      <button class="tab" role="tab" data-tab="leads" aria-selected="false">Enquiries <span class="count num" id="overdueBadge" hidden></span></button>
      <button class="tab" role="tab" data-tab="team" aria-selected="false" id="teamTab">Team &amp; WhatsApp</button>
    </nav>
  </div>
</header>
<main id="main">
  <section id="view-dash"></section>
  <section id="view-leads" hidden></section>
  <section id="view-team" hidden></section>
</main>
<button class="btn primary fab" id="fab" type="button">+ New enquiry</button>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>

</body>
</html>
